<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星展信用卡消費分析 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#EEF1F0; --panel:#FFFFFF; --ink:#1E2B2F; --muted:#5D6B70; --rule:#D5DBD9;
  --accent:#1F5F8B; --up:#C2402F; --down:#2D8659; --chip:#E2E7E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A1C; --panel:#1C2427; --ink:#E6ECEA; --muted:#9AA8AC; --rule:#2E3A3E;
    --accent:#6FB0DE; --up:#F07A68; --down:#6CC596; --chip:#263034;
  }
}
:root[data-theme="dark"]{
  --bg:#141A1C; --panel:#1C2427; --ink:#E6ECEA; --muted:#9AA8AC; --rule:#2E3A3E;
  --accent:#6FB0DE; --up:#F07A68; --down:#6CC596; --chip:#263034;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:28px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:700;font-size:17px;margin-left:6px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.months{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 0 6px}
.months button{flex:none;border:1px solid transparent;background:var(--chip);color:var(--ink);
  font:inherit;font-size:14px;padding:5px 13px;border-radius:999px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,li[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{background:var(--panel);border-radius:14px;padding:18px 18px 8px;margin-bottom:18px}
.hero h2,.panel h2{font-size:17px;margin:0 0 2px;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.chart-box{position:relative;height:320px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;margin-bottom:18px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.chart-box{height:260px}}
.panel{background:var(--panel);border-radius:10px;padding:18px;min-width:0}
.split{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:480px){.split{grid-template-columns:1fr}.donut{max-width:180px;margin:0 auto}}
.donut{position:relative;aspect-ratio:1}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.center small{color:var(--muted);font-size:12px}.center strong{font-size:18px}
ol.cats{list-style:none;margin:0;padding:0}
ol.cats li{display:grid;grid-template-columns:12px 1fr auto;gap:4px 10px;align-items:center;padding:7px 6px;border-radius:6px;cursor:pointer}
ol.cats li:hover{background:var(--chip)}
ol.cats li[aria-selected="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.sw{width:12px;height:12px;border-radius:3px}
.cname{font-weight:500}.camt{text-align:right;font-weight:700}
.cmeta{grid-column:2/4;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:-3px}
.delta.up{color:var(--up)}.delta.down{color:var(--down)}
.bar{grid-column:2/4;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}
.trend-box{position:relative;height:250px;margin-top:8px}
.note{font-size:14px;color:var(--muted);margin:12px 0 0;max-width:62ch}
.note b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 10px}
.tools input,.tools select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:6px 10px}
.tools input{flex:1;min-width:160px}
.count{color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;border-bottom:1px solid var(--rule);padding:6px 8px}
td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
td.amt,th.amt{text-align:right;white-space:nowrap}
td.neg{color:var(--down)}
td.date{white-space:nowrap;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.tag i{width:8px;height:8px;border-radius:2px;display:inline-block}
.more{margin-top:10px;font:inherit;font-size:14px;background:none;border:1px solid var(--rule);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}
footer{color:var(--muted);font-size:12.5px;margin-top:22px;max-width:80ch}
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
html,body{height:100%}
.gate form{background:var(--panel);border-radius:14px;padding:28px;width:100%;max-width:360px}
.gate h1{font-size:22px}
.gate input{width:100%;font:inherit;padding:9px 12px;margin:14px 0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate button{width:100%;font:inherit;font-weight:700;padding:9px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
.gate button:disabled{opacity:.6}
.err{color:var(--up);font-size:14px;min-height:1.4em;margin:8px 0 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <h1>信用卡消費分析</h1>
    <p class="sub">這個頁面已加密，請輸入密碼查看。</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="密碼" required>
    <button id="unlockBtn">解鎖</button>
    <p class="err" id="gateErr" role="alert"></p>
  </form>
</div>
<div class="wrap" id="app">
  <header>
    <div>
      <h1 id="title">信用卡消費</h1>
      <p class="sub" id="subtitle"></p>
      <ul class="facts" id="facts"></ul>
    </div>
    <label class="toggle"><input type="checkbox" id="excl" checked> 不含分期與利息</label>
  </header>

  <nav class="months" id="months" aria-label="選擇月份"></nav>

  <section class="hero">
    <h2>每月消費組成</h2>
    <p class="hint">點選長條可切換月份；點圖例可隱藏類別</p>
    <div class="chart-box"><canvas id="stack" aria-label="每月各類別消費堆疊長條圖" role="img"></canvas></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2 id="mixTitle">類別分布</h2>
      <p class="hint" id="mixHint">點選類別可看趨勢與明細</p>
      <div class="split">
        <div class="donut"><canvas id="donut" aria-label="類別佔比圓餅圖" role="img"></canvas>
          <div class="center"><small id="dLabel">總計</small><strong id="dTotal">0</strong></div></div>
        <ol class="cats" id="cats" role="listbox" aria-label="類別"></ol>
      </div>
    </section>
    <section class="panel">
      <h2 id="trendTitle">月份變化</h2>
      <p class="hint" id="trendHint"></p>
      <div class="trend-box"><canvas id="trend" aria-label="類別每月金額折線圖" role="img"></canvas></div>
      <p class="note" id="trendNote"></p>
    </section>
  </div>

  <section class="panel">
    <h2 id="listTitle">消費明細</h2>
    <div class="tools">
      <input type="search" id="q" placeholder="搜尋商家" aria-label="搜尋商家">
      <select id="sort" aria-label="排序"><option value="date">依日期</option><option value="amt">依金額</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>消費日</th><th>商家</th><th>類別</th><th class="amt">金額</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
    <button class="more" id="more" hidden>顯示更多</button>
  </section>

  <footer id="foot"></footer>
</div>

let DATA, MONTHS;
const COLORS = {"餐飲":"#E0803A","交通":"#2F7FB5","購物":"#C0467A","日用品":"#7FA650","美容醫藥":"#A77BCB",
 "運動健身":"#1FA187","休閒娛樂":"#D9A62E","旅遊":"#4FB3C9","訂閱":"#6B7FD7","生活服務":"#9C8B74","教育學習":"#8FA37A",
 "分期付款":"#8A96A3","利息與費用":"#D2453B","回饋折抵":"#6FB98F","待確認":"#B79C86","未分類":"#AEB5B9"};
const ORDER = Object.keys(COLORS);
const EXCL = new Set(["分期付款","利息與費用"]);
const mLabel = m => +m.slice(5)+"月";
const fmt = n => (n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("zh-TW");
const state = {month:"all", cat:null, excl:true, q:"", sort:"date", limit:40};
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function rows(){ return DATA.tx.filter(t => !(state.excl && EXCL.has(t[4]))); }
function sumBy(list){ const o={}; list.forEach(t=>o[t[4]]=(o[t[4]]||0)+t[3]); return o; }
function catsPresent(){ const s=new Set(rows().map(t=>t[4])); return ORDER.filter(c=>s.has(c)); }

// ---------- facts ----------
function renderFacts(){
  const all = DATA.tx, real = all.filter(t=>!EXCL.has(t[4]));
  const total = real.reduce((a,t)=>a+t[3],0);
  const interest = all.filter(t=>t[4]==="利息與費用").reduce((a,t)=>a+t[3],0);
  const last = DATA.months[DATA.months.length-1];
  $("facts").innerHTML =
    `<li>實際消費<b>${fmt(total)}</b></li><li>每月平均<b>${fmt(total/MONTHS.length)}</b></li>`+
    `<li>利息與費用<b>${fmt(interest)}</b></li>` +
    (last.due!=null ? `<li>${mLabel(last.m)}應繳<b>${fmt(last.due)}</b>${last.dd?`（${last.dd.slice(5).replace("-","/")} 前）`:""}</li>` : "");
}

// ---------- month chips ----------
function renderMonths(){
  const opts = [["all","全部"]].concat(MONTHS.map(m=>[m,mLabel(m)]));
  $("months").innerHTML = opts.map(([v,l])=>`<button data-m="${v}" aria-pressed="${state.month===v}">${l}</button>`).join("");
  $("months").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.month=b.dataset.m; state.limit=40; update();});
}

// ---------- charts ----------
let stack, donut, trend;
function baseOpts(){
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = css("--muted");
  Chart.defaults.borderColor = css("--rule");
}
function renderStack(){
  const data = rows(), cats = catsPresent();
  const ds = cats.map(c=>({label:c, backgroundColor:COLORS[c], borderRadius:2, maxBarThickness:46,
    data: MONTHS.map(m=>data.filter(t=>t[0]===m&&t[4]===c).reduce((a,t)=>a+t[3],0))}));
  const negs = MONTHS.map((_,i)=>ds.reduce((a,d)=>a+Math.min(0,d.data[i]),0));
  const yMin = Math.min(...negs) < 0 ? Math.floor(Math.min(...negs)/1000)*1000 : 0;
  if(stack){ stack.data.datasets = ds; stack.options.scales.y.min = yMin; applyStackHighlight(); stack.update(); return; }
  stack = new Chart($("stack"),{type:"bar",data:{labels:MONTHS.map(mLabel),datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,min:yMin,ticks:{callback:v=>fmt(v)}}},
      plugins:{legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10,padding:12}},
        tooltip:{itemSort:(a,b)=>b.raw-a.raw,filter:i=>i.raw!==0,
          callbacks:{label:i=>` ${i.dataset.label}  ${fmt(i.raw)}`,
            footer:items=>"合計  "+fmt(items.reduce((a,i)=>a+i.raw,0))}}},
      onClick:(e,els)=>{ if(els.length){ const m=MONTHS[els[0].index]; state.month = state.month===m?"all":m; state.limit=40; update(); } }}});
  applyStackHighlight();
}
function applyStackHighlight(){
  const idx = MONTHS.indexOf(state.month);
  stack.data.datasets.forEach(d=>{
    d.backgroundColor = MONTHS.map((_,i)=> (idx<0||i===idx) ? COLORS[d.label] : COLORS[d.label]+"55");
  });
}
function scoped(){ const r=rows(); return state.month==="all"? r : r.filter(t=>t[0]===state.month); }
function prevMonth(){ const i=MONTHS.indexOf(state.month); return i>0?MONTHS[i-1]:null; }

function renderMix(){
  const cur = sumBy(scoped());
  const pm = prevMonth(); const prev = pm ? sumBy(rows().filter(t=>t[0]===pm)) : null;
  const cats = Object.keys(cur).filter(c=>cur[c]!==0).sort((a,b)=>cur[b]-cur[a]);
  const total = cats.reduce((a,c)=>a+cur[c],0);
  const pos = cats.filter(c=>cur[c]>0), posTotal = pos.reduce((a,c)=>a+cur[c],0);
  const max = Math.max(...pos.map(c=>cur[c]),1);
  $("mixTitle").textContent = state.month==="all" ? `${RANGE}類別分布` : `${mLabel(state.month)}類別分布`;
  $("mixHint").textContent = prev ? `與${mLabel(pm)}相比；點選類別可看趨勢與明細` : "點選類別可看趨勢與明細";
  $("dLabel").textContent = state.cat ? state.cat : "總計";
  $("dTotal").textContent = fmt(state.cat ? (cur[state.cat]||0) : total);
  $("cats").innerHTML = cats.map(c=>{
    const share = posTotal? (cur[c]/posTotal*100):0;
    let d=""; if(prev){ const diff=cur[c]-(prev[c]||0); if(diff) d=`<span class="delta ${diff>0?"up":"down"}">${diff>0?"+":"−"}${fmt(Math.abs(diff))}</span>`; else d="<span>持平</span>"; }
    return `<li role="option" tabindex="0" data-c="${c}" aria-selected="${state.cat===c}">
      <span class="sw" style="background:${COLORS[c]}"></span><span class="cname">${c}</span><span class="camt">${fmt(cur[c])}</span>
      <span class="cmeta"><span>${cur[c]>0?share.toFixed(1)+"%":"折抵"}</span>${d}</span>
      <span class="bar"><i style="width:${Math.max(0,cur[c]/max*100)}%;background:${COLORS[c]}"></i></span></li>`;}).join("");
  $("cats").querySelectorAll("li").forEach(li=>{
    const pick=()=>{ state.cat = state.cat===li.dataset.c?null:li.dataset.c; state.limit=40; update(); };
    li.onclick=pick; li.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();} };
  });
  const dd = {labels:pos, datasets:[{data:pos.map(c=>cur[c]), borderWidth:2, borderColor:css("--panel"),
    backgroundColor:pos.map(c=> !state.cat||state.cat===c ? COLORS[c] : COLORS[c]+"40")}]};
  if(donut){ donut.data=dd; donut.update(); return; }
  donut = new Chart($("donut"),{type:"doughnut",data:dd,options:{cutout:"68%",responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` ${i.label}  ${fmt(i.raw)}`}}},
    onClick:(e,els)=>{ if(els.length){ const c=donut.data.labels[els[0].index]; state.cat=state.cat===c?null:c; state.limit=40; update(); } }}});
}

function renderTrend(){
  const data = rows();
  let series, label, color;
  if(state.cat){
    label=state.cat; color=COLORS[state.cat];
    series = MONTHS.map(m=>data.filter(t=>t[0]===m&&t[4]===state.cat).reduce((a,t)=>a+t[3],0));
    $("trendTitle").textContent = `${state.cat}的月份變化`;
    $("trendHint").textContent = `虛線為 ${MONTHS.length} 個月平均`;
  } else {
    label="合計"; color=css("--accent");
    series = MONTHS.map(m=>data.filter(t=>t[0]===m).reduce((a,t)=>a+t[3],0));
    $("trendTitle").textContent = "每月總額變化";
    $("trendHint").textContent = "選擇一個類別，改看該類別的趨勢；虛線為平均";
  }
  const avg = series.reduce((a,b)=>a+b,0)/series.length;
  const hi = series.indexOf(Math.max(...series)), lo = series.indexOf(Math.min(...series));
  $("trendNote").innerHTML = `平均每月 <b>${fmt(avg)}</b>；最高是${mLabel(MONTHS[hi])}的 <b>${fmt(series[hi])}</b>，最低是${mLabel(MONTHS[lo])}的 <b>${fmt(series[lo])}</b>。`;
  const idx = MONTHS.indexOf(state.month);
  const cfg = {labels:MONTHS.map(mLabel),datasets:[
    {label, data:series, borderColor:color, backgroundColor:color+"22", fill:true, tension:.3, borderWidth:2.5,
     pointRadius:MONTHS.map((_,i)=>i===idx?6:3), pointBackgroundColor:color},
    {label:"平均", data:series.map(()=>avg), borderColor:css("--muted"), borderDash:[5,5], borderWidth:1.2, pointRadius:0, fill:false}]};
  if(trend){ trend.data=cfg; trend.update(); return; }
  trend = new Chart($("trend"),{type:"line",data:cfg,options:{responsive:true,maintainAspectRatio:false,
    interaction:{mode:"index",intersect:false},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}},x:{grid:{display:false}}},
    plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>` ${i.dataset.label}  ${fmt(i.raw)}`}}}}});
}

function renderTable(){
  let list = scoped();
  if(state.cat) list = list.filter(t=>t[4]===state.cat);
  if(state.q) list = list.filter(t=>t[2].toLowerCase().includes(state.q.toLowerCase()));
  list = list.slice().sort(state.sort==="amt" ? (a,b)=>b[3]-a[3] : (a,b)=>(b[0]+b[1]).localeCompare(a[0]+a[1]));
  const sum = list.reduce((a,t)=>a+t[3],0);
  const scope = (state.month==="all"?RANGE:mLabel(state.month)) + (state.cat?`・${state.cat}`:"");
  $("listTitle").textContent = `消費明細：${scope}`;
  $("count").textContent = `${list.length} 筆，合計 ${fmt(sum)}`;
  const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
  $("rows").innerHTML = list.slice(0,state.limit).map(t=>`<tr><td class="date">${+t[0].slice(5)}月帳單<br>${t[1]}</td>
    <td>${esc(t[2])}</td><td><span class="tag"><i style="background:${COLORS[t[4]]}"></i>${t[4]}${t[5]?"／"+esc(t[5]):""}</span></td>
    <td class="amt ${t[3]<0?"neg":""}">${fmt(t[3])}</td></tr>`).join("") ||
    `<tr><td colspan="4" style="color:var(--muted)">沒有符合的交易。請清除搜尋文字或改選其他月份。</td></tr>`;
  $("more").hidden = list.length <= state.limit;
}

function update(){
  document.querySelectorAll("#months button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.m===state.month));
  if(state.cat && !catsPresent().includes(state.cat)) state.cat=null;
  renderStack(); renderMix(); renderTrend(); renderTable();
}

$("excl").onchange = e=>{ state.excl=e.target.checked; update(); };
$("q").oninput = e=>{ state.q=e.target.value.trim(); state.limit=40; renderTable(); };
$("sort").onchange = e=>{ state.sort=e.target.value; renderTable(); };
$("more").onclick = ()=>{ state.limit+=60; renderTable(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{
  baseOpts(); [stack,donut,trend].forEach(c=>c&&c.destroy()); stack=donut=trend=null; update(); });

let RANGE = "";
function start(d){
  DATA = d; MONTHS = DATA.months.map(m=>m.m);
  const y = MONTHS[0].slice(0,4);
  RANGE = `${+MONTHS[0].slice(5)}–${+MONTHS[MONTHS.length-1].slice(5)} 月`;
  $("title").textContent = `${y} 年 ${RANGE}信用卡消費`;
  $("subtitle").textContent = `星展信用卡，${MONTHS.length} 期帳單逐筆分類`;
  document.title = `${y} 年 ${RANGE}信用卡消費`;
  $("foot").textContent = `資料來源：星展銀行信用卡電子帳單，${DATA.generated} 自動更新。金額為新台幣，本頁僅供記帳參考。`;
  $("gate").hidden = true; $("app").hidden = false;
  if(!window.Chart){ document.querySelector(".hero").innerHTML = "<p>圖表元件載入失敗，請重新整理頁面。</p>"; return; }
  baseOpts(); renderFacts(); renderMonths(); update();
}
async function unlock(pw){
  const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
if(PLAIN){ start(PLAIN); }
else {
  $("app").hidden = true; $("gate").hidden = false; $("pw").focus();
  $("gateForm").onsubmit = async e => {
    e.preventDefault(); $("gateErr").textContent = ""; $("unlockBtn").disabled = true;
    try { start(await unlock($("pw").value)); }
    catch { $("gateErr").textContent = "密碼不正確，請再試一次。"; $("pw").select(); }
    finally { $("unlockBtn").disabled = false; }
  };
}
</script>
